[package]
name = "rrl-directory-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Marks this crate as a fuzz target set: `cargo fuzz` looks for it.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rrl-directory = { path = ".." }

# One target per parser that reads something an outsider controls. A parser that panics is a
# server that can be stopped from outside, which is why these are the ones worth fuzzing:
# the directory's own code cannot cause undefined behaviour (the crate forbids unsafe), but a
# panic is not undefined behaviour and `forbid` does not prevent it.

[[bin]]
name = "codec"
path = "fuzz_targets/codec.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter"
path = "fuzz_targets/filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ldif"
path = "fuzz_targets/ldif.rs"
test = false
doc = false
bench = false

[[bin]]
name = "schema"
path = "fuzz_targets/schema.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dn"
path = "fuzz_targets/dn.rs"
test = false
doc = false
bench = false

[[bin]]
name = "endpoint"
path = "fuzz_targets/endpoint.rs"
test = false
doc = false
bench = false

# The same patches the crate itself applies, and they have to be repeated here because a patch
# applies to one workspace only. Without the first, the fuzz build resolves `rasn-ldap` from
# crates.io, which does not have the assertion-failed result code this project added to its
# vendored copy. Without the second it resolves `rskrb5` from crates.io, whose pin on the
# *release candidate* of `pbkdf2` cannot coexist with the released 0.13.0 the server hashes
# passwords with - which is why the fuzzer would not build at all after the SASL work, with an
# error about picking a version for `pbkdf2` rather than anything naming kerberos.
[patch.crates-io]
rasn-ldap = { path = "../vendor/rasn-ldap" }
rskrb5 = { path = "../vendor/rskrb5" }
