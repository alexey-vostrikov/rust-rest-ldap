[package]
name = "rust-rest-ldap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "LDAP server with REST API & file backends"
license = "MIT"
readme = "README.md"

[[bin]]
name = "rust-rest-ldap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1.0.154"
