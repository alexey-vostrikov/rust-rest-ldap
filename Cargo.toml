[package]
name = "rust-rest-ldap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "LDAP server with REST API & file backends"
license = "MIT"
readme = "README.md"

default-run = "rust-rest-ldap"

[[bin]]
name = "rust-rest-ldap"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
humantime = "2.4.0"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
rasn = "0.30.0"
rasn-ldap = "0.30.0"
redb = "4.4.0"
roaring = "0.12.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = { version = "2.6.1", features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "net", "time", "sync", "rt-multi-thread", "signal"] }
# default features pull aws-lc-rs and ring, which are C: keep only the wrapper
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12"] }
uuid = { version = "1.29.0", features = ["v5"] }
# The public certificate authorities, compiled in: a client that trusts whatever the
# filesystem happens to hold is a client that works on one machine only.
webpki-roots = "1.0.4"
yescrypt = "0.1.0"

[dev-dependencies]
futures = "0.3.34"
rcgen = "0.14.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# A local copy of rasn-ldap with the RFC 4511 result codes upstream is missing
# (118-123, including assertionFailed). The patch is the enum variants only; it is
# meant to be offered upstream and dropped once a release carries them.
[patch.crates-io]
rasn-ldap = { path = "vendor/rasn-ldap" }
