[package]
name = "rust-rest-ldap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "LDAP server with REST API & file backends"
license = "MIT"
readme = "README.md"

default-run = "rust-rest-ldap"

[[bin]]
name = "rust-rest-ldap"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
humantime = "2.4.0"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
rasn = "0.30.0"
rasn-ldap = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "net", "time", "sync", "rt-multi-thread", "signal"] }
uuid = { version = "1.29.0", features = ["v5"] }
yescrypt = "0.1.0"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
