[package]
name = "rust-rest-ldap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "LDAP server with REST API & file backends"
license = "MIT"
readme = "README.md"

default-run = "rust-rest-ldap"

[[bin]]
name = "rust-rest-ldap"
path = "src/main.rs"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
base64 = "0.23.1"
bcrypt = "0.19.3"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
# The REST backend's HTTP client. hyper is already in the build through axum; asking for its
# `client` feature adds no crate, only the half of the protocol that is not compiled yet.
hyper = { version = "1.12.0", features = ["client", "http1"] }
http-body-util = "0.1.5"
hyper-util = { version = "0.1.21", features = ["tokio"] }
humantime = "2.4.0"
# The one place this crate steps outside safe Rust, and only to map a file it owns: see
# `src/index_file.rs`. Everything else - protocol parsing, TLS, HTTP, storage - is safe code.
memmap2 = "0.9"
md-5 = "0.11.0"
pbkdf2 = "0.13.0"
rasn = "0.30.0"
rasn-ldap = "0.30.0"
redb = "4.4.0"
# Kerberos for SASL GSSAPI, in pure Rust and with no C: the accept side, the SPNEGO wrapper and the
# per-message tokens all come from here. It replaces the vendored `rskrb5` and the hand-written
# framing this crate used to carry.
krb5 = "1.0"
roaring = "0.12.0"
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha-crypt = "0.6.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
subtle = { version = "2.6.1", features = ["std"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "net", "time", "sync", "rt-multi-thread", "signal"] }
# default features pull aws-lc-rs and ring, which are C: keep only the wrapper
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12"] }
# String preparation for matching (RFC 4518). Both are pure Rust with no C: the alternative was
# `value.to_lowercase()`, which agrees with the RFC on ASCII and differs on everything else.
caseless = "0.2.2"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v5"] }
# The public certificate authorities, compiled in: a client that trusts whatever the
# filesystem happens to hold is a client that works on one machine only.
webpki-roots = "1.0.4"
yescrypt = "0.1.0"

# The KDC engine, for the two ways this crate uses it. In the daemon it answers port 88 in this
# process, reading the realm out of this server's own directory - which is the whole point of a
# self-contained domain: one process, one store, no second daemon to keep in step. In the tests it
# is an in-process realm to run a bind against, instead of a keytab on the test host.
#
# Optional because a directory server that does not issue tickets should not carry a KDC, and
# `RUST_HEIMDAL_KDC`-free builds stay what they were.
rust-kdc = { path = "../rust-kdc", optional = true, features = ["hdb-ldap"] }

# SMB2/3 for `IPC$`, which is where a Samba member's join actually begins: it connects to
# `\\DC\IPC$` and opens `lsarpc` through it. Without `localfs` - this server serves no files - and
# with `krb5`, so a machine account can authenticate with the ticket it already has.
smb-server = { path = "../rust-smb-server", version = "0.9.1", optional = true, default-features = false, features = ["krb5"] }

# Logging. `tracing` without a subscriber records nothing, and the call sites look instrumented
# either way - which is how a refusal in the RPC dispatcher came to be invisible. The subscriber
# reads what the configuration and the command line already offered: `-d`, `log_timestamp`,
# `log_caller`, `--log`.
tracing = "0.1.44"
# `env-filter` for `RUST_LOG`: the reason to reach for it is always one module that misbehaves,
# and `RUST_LOG=smb_server::rpc=debug` says that without raising the whole process. `time` for
# `log_timestamp` in RFC 3339.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }

[features]
# Port 88: AS-REQ, TGS-REQ, and `krbtgt/<REALM>` provisioned on first start.
kdc = ["dep:rust-kdc"]
# Port 445 and the `IPC$` share a join talks to.
smb = ["dep:smb-server"]

[dev-dependencies]
rust-kdc = { path = "../rust-kdc" }
futures = "0.3.34"
rcgen = "0.14.10"
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

# A local copy of rasn-ldap with the RFC 4511 result codes upstream is missing
# (118-123, including assertionFailed). The patch is the enum variants only; it is
# meant to be offered upstream and dropped once a release carries them.
[patch.crates-io]
rasn-ldap = { path = "vendor/rasn-ldap" }
