# Русская диагностика для оператора.
#
# Ключи совпадают с ENGLISH в src/i18n.rs. Чего здесь нет, то выводится по-английски:
# половина перевода не должна мешать серверу стартовать.
#
# Тексты для клиента (diagnosticMessage в LDAP-ответах) здесь намеренно отсутствуют:
# это часть протокола, скрипты на них смотрят, и они остаются английскими.

# Старт
start.banner: "rust-rest-ldap {version}: бэкенд '{backend}', база '{base}', пользователей {users}, групп {groups}"
start.danger: "ОПАСНО: конфигурация включает {settings} — подтверждено через AllowDangerousSettings"
start.passwords: "пароли: хранение {scheme}, разрешено слабых схем: {weak}; правил ACL {rules}; простой bind без шифрования {plaintext}"
start.listening: "ldap: слушаю {addr}"
start.language: "диагностика: язык '{locale}' (источник: {source})"
start.shutting_down: "останавливаюсь"
start.export_done: "выгружено записей: {entries} в {path}"
start.http: "http: слушаю {addr} (health, метрики, callback)"
start.journal: "журнал изменений: {path}"
start.journal_stdout: "журнал изменений: стандартный вывод"

# Ошибки для оператора
error.config: "ошибка конфигурации: {detail}"
error.backend: "ошибка бэкенда: {detail}"
error.server: "ошибка сервера: {detail}"
error.http: "ошибка HTTP-сервера: {detail}"
error.signal: "не удалось установить обработчик SIGUSR1: {detail}"
error.reload: "перезагрузка не удалась, оставляю текущий каталог: {detail}"
error.write: "запись не удалась: {detail}"
error.config_apply: "применение зафиксированной конфигурации не удалось: {detail}"
error.hash_upgrade: "не удалось сохранить обновлённый хеш пароля: {detail}"
error.password_upgrade: "обновление хеша пароля для '{dn}' не удалось: {detail}"
error.accept: "ошибка при приёме соединения: {detail}"
error.tls_handshake: "клиент {peer}: TLS-рукопожатие не удалось: {detail}"
error.starttls_handshake: "клиент {peer}: StartTLS-рукопожатие не удалось"
error.malformed: "клиент {peer} прислал некорректное сообщение, соединение закрыто"
error.client: "клиент {peer}: {detail}"
error.sync_lagged: "соединение {peer} отстало на {missed} изменений; постоянные поиски на нём сняты"
error.peer: "сосед {url}: {detail}; повтор"
error.peer_id: "сосед {url} представился сервером {actual}, а в конфигурации указан {expected}: два узла не должны иметь один id, и этот сосед реплицируется под чужим именем"
error.peer_conflict: "сосед {url} и этот узел расходятся по {dn}: {why}; оставлена местная версия"
error.panic: "соединение {peer} оборвалось внутренней ошибкой; слушатели не затронуты"
error.journal: "не удаётся записать журнал изменений: {detail}"
error.shutdown_timeout: "плавная остановка не уложилась в {grace}, закрываю оставшиеся соединения"
warn.schema: "предупреждение схемы: {detail}"

# Диагностика конфигурации
config.server_id: "некорректный server id: {detail}"
config.peers: "ошибка в разделе peers: {detail}"
config.referral: "ошибка в разделе referrals: {detail}"
config.tls_material: "use_tls включён, но server_cert и server_key заданы не оба"
config.schema_read: "не удаётся прочитать файл схемы '{path}': {detail}"
config.schema: "ошибка загрузки схемы из '{path}': {detail}"
config.schema_mode: "неизвестный режим схемы '{value}'; ожидается strict, warn или off"
config.locale: "неизвестный язык '{value}'; файл переводов '{path}' отсутствует или не читается"
config.plain_http: "задан http_listen_addr '{address}', но callback-слушатель работает по простому HTTP, и его токен идёт открытым текстом; добавьте рядом AllowPlainHttpRest: 'Yes I know this is bad idea', если это допустимо"
error.import: "не удалось импортировать: {detail}"
error.read: "не удалось прочитать файл: {detail}"
import.done: "импортировано записей: {entries}"
check.schema_violation: "нарушение схемы в '{dn}': {detail}"
error.schema_reload: "не удалось перезагрузить схему, прежняя остаётся в силе: {detail}"
start.schema_reloaded: "схема перезагружена: типов атрибутов {attributes}, классов объектов {classes}"
config.store_empty: "'{path}' — хранилище конфигурации, но в нём нет ни одной генерации; зафиксируйте её через --config-commit или укажите файл конфигурации"
error.store_path_missing: "для --{command} нужен каталог хранилища: укажите его через -c /etc/rust-rest-ldap/config.d"
error.store_not_a_directory: "'{path}' — не каталог; хранилище генераций это каталог, а обычный файл это конфигурация"
error.store: "хранилище конфигурации: {detail}"
store.done: "зафиксировано как {what}"
store.collected: "удалены генерации {numbers}"
config.store: "не удалось прочитать хранилище конфигурации '{path}': {detail}"
error.index: "не удалось построить индекс: {detail}"
check.index_mismatch: "индекс расходится с данными для {query}: потеряно [{lost}], лишнее [{extra}]"
check.index_loose: "индекс по '{attribute}' сужает слабее, чем мог бы: {extra} лишних кандидатов на выборке"
check.index_sound: "индекс корректен: сверено с перебором {checked} запросов, отдано перебору {skipped}"
check.index_broken: "индекс НЕ корректен: из {checked} сверенных с перебором запросов {missing} теряют записи, {wrong} расходятся с ним"
check.reindex_done: "проиндексировано записей {entries}, атрибутов {attributes}, байт {bytes}, за {millis} мс"
check.ok: "конфигурация работоспособна: бэкенд '{backend}', база '{base_dn}', записей {entries}, с нарушениями схемы {broken}"
error.bootstrap: "не удалось создать первого администратора: {detail}"
start.bootstrap_created: "создан первый администратор '{dn}' с хешем {scheme}; уберите секцию bootstrap из конфигурации"
start.bootstrap_not_empty: "bootstrap пропущен: в хранилище уже {entries} записей, а первый администратор создаётся только в пустом"
config.bootstrap_password_missing: "раздел 'bootstrap' не указывает пароль: задайте password_file или password_env, либо уберите раздел"
config.bootstrap_password_ambiguous: "раздел 'bootstrap' задаёт и password_file, и password_env; оставьте один источник, чтобы у вопроса 'откуда пароль первого администратора' был один ответ"
config.dangerous: "конфигурация включает {settings}, что ослабляет сервер, но AllowDangerousSettings не задан; добавьте на верхнем уровне AllowDangerousSettings: 'Yes I know this is bad idea', если так и задумано"
config.weak_ack: "заданы слабые схемы паролей ({requested}), но AllowWeakHashes не задан; если так и задумано, добавьте в раздел passwords AllowWeakHashes: 'Yes I know this is bad idea'"
config.index: "ошибка в разделе 'indexes': {detail}"
config.password: "ошибка в разделе 'passwords': {detail}"
config.access: "ошибка в разделе 'access': {detail}"
config.unknown_backend: "неизвестный бэкенд '{name}'; известны: {known}"
config.interval: "некорректный интервал обновления '{value}': {detail}"
config.parse: "не удаётся разобрать файл конфигурации '{path}': {detail}"
config.committed: "зафиксировано; работающий сервер применяет новые правила сразу"
config.committed_needs_restart: "зафиксировано; работающий сервер применяет новые правила сразу, но эти настройки вступят только после перезапуска: {settings}"
config.committed_not_applied: "зафиксировано, но работающий сервер не смог это применить и держит прежние правила: {detail}"
