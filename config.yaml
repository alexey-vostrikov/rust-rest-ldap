log_timestamp: false
log_caller: false

# Three backends: a remote HTTP service (`rest`), two JSON files (`file`), a durable entry
# store (`redb`). `backend:` names which one; without it the default is `null`, an empty
# read-only directory.
backends:
  # Users and groups come from an HTTP service: a GET of the two paths returns JSON arrays,
  # a change is a PUT of the whole object to `<path>/<cn>` with the name percent-encoded.
  #   auth_token             sent in the Authorization header, Token scheme
  #   http_request_timeout   a request that takes longer is abandoned (default 30s)
  #   ca_file                certificate authority for an `https` service; without it the
  #                          public roots are used
  rest:
    url: http://localhost:8000/api
    users_path: /ldap/user
    groups_path: /ldap/group
    #auth_token: <token>
    http_request_timeout: 30s
  file:
    users_path: examples/file/users.json
    groups_path: examples/file/groups.json
  # Durable store of whole entries: one transaction per change set, fsync on commit.
  # Use it instead of `file` when the data matters: the JSON backends rewrite the
  # whole file and keep users and groups in two files, so a crash can leave them out
  # of step. Select it with `-b redb`.
  redb:
    path: ./build/directory.redb
    durability: immediate   # immediate (default) or none for bulk loads

# Schema checking. strict refuses data that does not match the schema (the server
# then fails at startup with the first violations listed); warn reports and proceeds,
# which is what migrating foreign data needs; off skips checking and keeps the schema
# published. Extra definitions are read after the built-in core, in RFC 4512 syntax.
schema:
  mode: strict
  #files:
  #  - /etc/rust-rest-ldap/local.schema
  # Definitions added at run time through `cn=schema,cn=config` are written here by the server,
  # in the same syntax as the files above. There is no need to edit this by hand: the entry is
  # what a client writes, and this is where the result is kept so it survives a restart.
  #definitions:
  #  - >
  #    attributeType ( 1.3.6.1.4.1.99999.1.1 NAME 'favouriteDrink'
  #        EQUALITY caseIgnoreMatch SUBSTR caseIgnoreSubstringsMatch
  #        SYNTAX 1.3.6.1.4.1.1466.115.121.1.15 )

# Uniqueness and referential integrity.
#   unique           - values of these attributes must not repeat among the users OU;
#                      duplicates make `uid=alice,...` ambiguous, and a bind then picks
#                      whichever entry comes first.
#   allow_duplicates - turn the check off.
#   referential_integrity - on delete or rename, update the groups that list the user in
#                      memberUid, so no membership points at a name nobody answers to.
integrity:
  unique: [cn, uid]
  allow_duplicates: false
  referential_integrity: true

# Search indexes, built when the directory is loaded and rebuilt on every reload.
# `pres` answers (attribute=*), `eq` answers (attribute=value), `sub` answers
# (attribute=*part*) through three-character windows, `ord` answers (attribute>=value)
# and (attribute<=value). All four are supersets of the answer: the filter still runs on
# every candidate, so an index can only make a search faster, never change it.
# Per-attribute kinds replace the default; an attribute that is not configured uses
# `default`. `sub` costs memory in proportion to the text, so give it to the attributes
# people actually search by name.
indexes:
  default: [pres]
  attributes:
    cn: [eq, pres]
    uid: [eq]
    mail: [eq]
    objectClass: [eq, pres]
    # `memberOf` is what a client asks to find out who is in a group, and the value is a DN,
    # so equality is the whole query shape: `(memberOf=cn=admins,ou=groups,…)`.
    memberOf: [eq]
    gidNumber: [eq]
    uidNumber: [eq]

# Multi-master, level one: one entry at a time, last writer wins.
#
# Two nodes that both accept writes converge only if every change is numbered, the numbers
# order, and "the order says nothing" has an answer of its own. `server_id` is this node's
# number and rides in the third field of every change sequence number; `peers` are the nodes
# it replicates with. Zero means "this node does not replicate", which is what an unconfigured
# server is - and a node with no id cannot have peers, because it could not tell its own
# changes from theirs.
#
# A peer is an ordinary LDAP server, and the exchange is RFC 4533 refreshAndPersist: a change
# arrives pushed, including a deletion, which a poll cannot express. A node that has been away
# resumes from its cookie, and if the journal no longer reaches back that far it is told to do
# a full refresh rather than silently skip what it missed.
#
# `journal_keep` bounds how far back this node can answer: the journal is the only place a
# deletion is remembered. Omit it and nothing is pruned - the honest default for a node whose
# peers may be down for a long time, and a slow leak for one nobody reads. Zero is refused:
# it would discard the only record that a deletion ever happened.
#
# `conflict_log` is where a disagreement with a peer is written down, one JSON object per line:
# the DN, both change numbers and the reason the timestamp was not the answer. Without it a
# conflict is printed to standard error and forgotten, and after a restart there is no record
# that an entry was ever kept at the expense of another. The metric
# `ldap_replication_conflicts_total` counts them either way, so it can be alerted on.
#server_id: 1
#replication:
#  journal_keep: 100000
#  # The other bound, and the one a count cannot express: a quiet directory keeps a year of
#  # records under a generous count, a busy one keeps hours. A tombstone say what used to exist,
#  # so it should outlive the slowest peer and no longer. Zero is refused: it would drop the only
#  # record that a deletion ever happened.
#  journal_max_age: 30d
#  conflict_log: /var/log/rust-rest-ldap/conflicts.jsonl
#peers:
#  - url: ldap://node2.example.com:389
#    server_id: 2                     # checked at the first exchange: two nodes must not share one
#    bind_dn: cn=replicator,dc=example,dc=com   # read access to the whole naming context
#    password: <secret>

# SASL: proving identity by Kerberos ticket instead of by password.
#
# A password bind needs the password on the client machine - in a file, readable by the service
# that runs as that account. A ticket the client already holds replaces it, and this server never
# sees a secret that could be reused elsewhere. `ldapsearch -Y GSSAPI` is the client side.
#
# The keytab is what `kadmin ktadd -k` produced for this service's principal, typically
# `ldap/<hostname>@REALM`. It is read once at startup: reading it per bind would turn a file
# permission mistake into a request-by-request failure. `--check-config` validates the section
# WITHOUT reading the file, since on a hardened host it belongs to root and the service account.
#
# `realms` is not optional when a keytab is set. A ticket from a realm nobody mapped has no
# honest subtree, and guessing one would put a stranger's principal into somebody's directory.
# Every value substituted into `dn` is escaped first, so a principal whose name contains a comma
# cannot address an entry outside the template.
#
# With this section present the server also publishes an Active Directory compatible schema
# (`userPrincipalName`, `sAMAccountName`, `userAccountControl`, `objectGUID`, `servicePrincipalName`
# and the `user`/`group`/`computer` classes): a client that authenticates by ticket is usually from
# that world and asks for those names. `userAccountControl` is honoured on a ticket bind -
# ACCOUNTDISABLE and LOCKOUT are refusals - and an account is looked up by its userPrincipalName
# before the template, refusing an ambiguous one.
#
# A ticket is accepted only over TLS or StartTLS: channel binding is not implemented, so a captured
# ticket could otherwise be replayed. The SASL security layer is not implemented either - the client
# must select "none", because TLS is where the encryption belongs.
#sasl:
#  keytab: /etc/rust-rest-ldap/ldap.keytab
#  service_principal: ldap/host.example.com@EXAMPLE.COM
#  realms:
#    - name: example.com
#      dn: "uid={user},ou=users,{base}"

# Subtrees this server does not hold, and where a client is sent for them.
#
# A referral is not an error: the server answers `searchResRef` and the client asks the other
# server itself. Nothing is copied and nothing is cached, so this closes a gap in the tree
# without a second copy of it. A base outside every referral and outside this tree is still
# `noSuchObject` - otherwise a typo in a DN would turn into a redirect.
#
# `manageDsaIT` is recognised: a client that asks not to be redirected gets the entry itself.
#referrals:
#  - dn: dc=remote,dc=com
#    url: ldaps://ldap.remote.example.com

# What the server refuses to do, whatever the client asked for.
#
# Every client may ask for everything: `ldapsearch -z 0` is the ordinary spelling of it, and against
# a large directory that is one request that occupies the server and is bounded by nothing an
# operator wrote down. A policy is the limit the operator wrote, and the smaller of the two wins.
#
# `size_limit` bounds what is sent and is applied to the entries that matched - after the filter, so
# a limit of a thousand never refuses a search that would have returned one entry. `time_limit`
# bounds the scan, and it is the only limit that bounds a search returning almost nothing: a broad
# filter with no index costs the scan, not the answer.
#
# Absent or zero means no limit, which is what every deployment had before this existed. That is a
# default, not an oversight: a limit chosen by the software would be one nobody measured, and
# refusing a legitimate bulk export is its own kind of outage.
#limits:
#  size_limit: 5000
#  time_limit: 30

# Language of the diagnostics an OPERATOR reads: startup lines, configuration errors,
# the journal. Client-visible protocol text stays English ASCII, because scripts match on
# it. Fallback order: this key, then RUST_REST_LDAP_LOCALE, then LC_ALL, then LANG.
# Translations live in locale/<tag>.yaml; English is built in, so `en` needs no file.
#locale: ru
#locale_file: locale/ru.yaml

# DANGEROUS SETTINGS. A setting that weakens the server does not take `true`: it takes
# the sentence below, word for word, and the master switch here must be on as well.
# Two locks on purpose - the master says "I read this file", the specific one says "I
# meant that particular line". Remove this line and every dangerous setting below stops
# working, which is what a config copied from somewhere else should do.
AllowDangerousSettings: "Yes I know this is bad idea"

respect_control_criticality: true

# Password hashes: weak schemes are refused unless listed one by one here.
# Known weak schemes: ssha, sha, smd5, md5, ssha256, ssha384, ssha512, sha256,
# sha384, sha512, crypt-md5, crypt-sha256, crypt-sha512, cleartext.
passwords:
  store_scheme: argon2id      # argon2id (default) or pbkdf2-sha512
  # Rewrite a stored hash into store_scheme on a successful bind: the only moment
  # the password itself is known. Off means an old {SSHA} directory stays as it is.
  upgrade_on_bind: true
  # DANGEROUS. A weak hash is readable by anyone who steals the file, so the server
  # only verifies one if the operator says so in words. Without the sentence below
  # and a non-empty list, the server refuses weak schemes - and refuses to start if a
  # list is given without it. This example acknowledges {SSHA} because the shipped
  # example data uses it; a directory written by this server needs neither.
  AllowWeakHashes: "Yes I know this is bad idea"
  AllowedWeakHashes: "ssha"

# Simple bind over an unencrypted connection. false matches Samba AD: the
# password is refused with strongerAuthRequired until LDAPS or StartTLS is used.
bind:
  # The sentence, not `true`: a password in the clear is readable on the path.
  AllowUnencryptedBind: "Yes I know this is bad idea"

# Access rules, evaluated in order: the first rule matching subject + base +
# attributes decides. An empty rights list is an explicit deny.
# Subjects: admin, users, anonymous, self, dn=<dn>, group=<cn>
# Rights: read, search, compare, write, auth
# Omit the section to get: admin - everything; self - own entry without
# userPassword; anonymous - nothing.
#access:
#  - subject: admin
#    attributes: ["*"]
#    rights: [read, search, compare, write, auth]
#  - subject: self
#    attributes: [userPassword]
#    rights: []
#  - subject: group=auditors
#    base: dc=example,dc=com
#    attributes: [cn, mail]
#    rights: [read]

users_ou_name: users
groups_ou_name: groups

# TLS: set both files to enable StartTLS, and use_tls to accept LDAPS on this
# listener from the first byte. A configured path that cannot be read is a startup
# error, so leaving these commented out means "no TLS" and nothing else.
use_tls: false
#server_cert: server.crt
#server_key: server.key

# The callback listener has no TLS, so callback_auth_token travels in the clear on
# every reload request. Set the address only on a trusted network, and say so here.
AllowPlainHttpRest: "Yes I know this is bad idea"
# The first administrator.
#
# An empty directory cannot be filled over the protocol: `add` needs a bind, and a bind
# needs an entry with a password that does not exist yet. This section names that entry;
# it is created at startup if, and only if, the store holds nothing at all. Left in place
# afterwards it does nothing, and says so in the log.
#
# The password comes from a file or an environment variable, never from the command line:
# arguments are visible in `ps` to every user on the machine.
#
# Only the `redb` backend can be seeded: the JSON backends read a file the server does not
# own, so an administrator created there would vanish at the next reload.
#bootstrap:
#  dn: cn=admin,ou=users,dc=example,dc=com     # default
#  password_file: /etc/rust-rest-ldap/admin.pass
#  # password_env: RUST_REST_LDAP_ADMIN_PASSWORD

# Observability.
#   journal        - path of the change journal, one JSON object per accepted write:
#                    time, op, dn, actor, peer, result code. A delete leaves no entry to
#                    carry modifiersName, so "who removed it" is only answerable if it was
#                    written down when it happened.
#   journal_stdout - send the journal to standard output instead, for a container.
observability:
  #journal: /var/log/rust-rest-ldap/changes.jsonl
  journal_stdout: false

# Metrics are always on: GET /metrics on the HTTP listener above, in the Prometheus text
# format. They describe the software, not the data, so they need no authentication.

http_listen_addr: localhost:8080

callback_auth_token: qwertyuiop1234567890
