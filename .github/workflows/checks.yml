name: checks

# The gates exist as make targets and nobody runs them on commit: this file is what puts them on
# the path. Three jobs, deliberately of different cost:
#
#   check  - every push and pull request, a few minutes. Formatting, lints, the test suite.
#   load   - the same tree in release, because the load tests compile to nothing in debug (their
#            numbers are meaningless there) but their assertions still matter.
#   miri   - nightly only. Fourteen minutes on ten modules; too slow for a pull request and
#            pointless to skip entirely.
#
#   fuzz   - nightly only, six targets at a minute each.
#
# Fuzzing was recorded here as impossible: "make fuzz-all needs the tree-sitter grammars, which
# cannot be downloaded on a runner without network". Both halves of that were wrong. The targets
# link this crate and libfuzzer; what they need is clang and cargo-fuzz, and no grammar at all -
# the grammars belong to the measurement tools (crapper, dryer, mutator), which parse Python-side.
# And the reason nothing built was fuzz/Cargo.lock: written before the vendored kerberos crate, it
# resolved rskrb5 from crates.io, whose pin on a pre-release pbkdf2 cannot coexist with the
# released one this server hashes passwords with. The error named pbkdf2 and said nothing about
# kerberos, which is how a wrong cause got written down for weeks.
#
# What is NOT here yet: mutation (six hours over the tree, and per-file selection does not work -
# D16 in docs/plan.md). One of its blockers is gone: the tree-sitter grammars are now baked into
# the metrics image, so it no longer needs a cache warmed by hand on one laptop.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 on Mondays: the slow jobs, off the working day, once a week.
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A hanging test is a failed test: the suite takes minutes, so half an hour means something
  # waits forever rather than being slow.
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The pinned version is read from rust-toolchain.toml rather than repeated here, so there is
      # still one place to change it. It has to be passed explicitly: dtolnay/rust-toolchain does
      # not read the file itself, and without a toolchain input it fails on every run with
      # "'toolchain' is a required input" - which is why this workflow was red from the start.
      - name: toolchain version
        id: rust
        run: |
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@v2

      - name: formatting
        run: cargo fmt --all -- --check

      - name: lints
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        run: cargo test --all-targets

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: toolchain version
        id: rust
        run: |
          channel=$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)
          test -n "$channel" || { echo "no channel in rust-toolchain.toml" >&2; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          # A different profile builds different artefacts; sharing the key would evict the
          # debug cache on every alternating run.
          key: release

      # Ten thousand entries, paged reads and concurrent clients. The file compiles to nothing
      # without --release, so this job is the only place its assertions run.
      - name: load tests
        run: cargo test --release --test load -- --nocapture --test-threads=1

  miri:
    # Only on the schedule: ten modules take about fourteen minutes under the interpreter, and a
    # pull request should not wait for that.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: miri

      # The module list lives in the Makefile, so this file does not keep a second copy that
      # drifts. Modules with system calls are absent on purpose: Miri cannot run sockets or files.
      - name: miri
        run: make miri CARGO=cargo

  fuzz:
    # On the schedule only: six targets at a minute each plus a build is a quarter of an hour a
    # pull request should not pay for, and a corpus that grew by a minute a week is enough to keep
    # these parsers honest.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          # The fuzz crate has its own lockfile and its own target directory; without listing it,
          # the cache covers only the main workspace and every run rebuilds six sanitized targets.
          workspaces: ". -> target, fuzz -> target"

      # clang brings libFuzzer's sanitizer runtime, which cargo-fuzz drives. No tree-sitter, no
      # grammar download: the target binaries are linked against this crate alone.
      - name: fuzzer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          cargo install cargo-fuzz --locked

      # The corpus is generated and not committed; what is committed is fuzz/seeds/<target>/*.bin,
      # a handful of inputs that put the fuzzer inside the grammar instead of making it rediscover
      # a parenthesis from random bytes. One minute per target, and a failure stops the job: a
      # finding is more valuable than the remaining four targets' coverage.
      - name: targets
        run: |
          set -eu
          for target in codec filter ldif schema dn endpoint; do
            echo "== $target"
            mkdir -p "fuzz/corpus/$target" fuzz/artifacts
            if [ -d "fuzz/seeds/$target" ] && [ -z "$(ls -A "fuzz/corpus/$target")" ]; then
              cp "fuzz/seeds/$target"/*.bin "fuzz/corpus/$target/" 2>/dev/null || true
            fi
            cargo +nightly fuzz run "$target" "fuzz/corpus/$target" -- \
              -max_total_time=60 -artifact_prefix="$PWD/fuzz/artifacts/"
          done

      # A crash without its input is a report nobody can reproduce: the corpus is gitignored, so
      # the one file worth keeping has to leave the runner another way.
      - name: crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
