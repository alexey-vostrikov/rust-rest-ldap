# A production configuration, as a starting point rather than a default.
#
# Copy to /etc/rust-rest-ldap/config.yaml, then:
#   install -m 0640 -o root -g rust-rest-ldap config.example.yaml \
#           /etc/rust-rest-ldap/config.yaml
#
# Every setting below that is commented out is a choice you make, not a gap you fill later.

# The naming context. Everything the server serves lives under it.
base_dn: dc=example,dc=com
users_ou_name: users
groups_ou_name: groups

# TLS on the LDAP port. Both files are PEM: the certificate chain, and the private key in
# PKCS#8 (`openssl genpkey`) or PKCS#1 (`openssl rsa`).
#
# With TLS on, the listener speaks LDAPS from the first byte; StartTLS works on top of a
# plaintext connection as well, so older clients have a path. A configuration with
# `use_tls: true` and no certificate is a startup error, not a silent fallback to plaintext.
use_tls: true
server_cert: /etc/rust-rest-ldap/server.crt
server_key: /etc/rust-rest-ldap/server.key
listen_addr: 0.0.0.0:636

# Entries, and never a JSON file: the store is one transaction, so a change set covering a
# user and the group that lists it cannot be applied halfway.
backend: redb
backends:
  redb:
    path: /var/lib/rust-rest-ldap/directory.redb
    # `immediate` flushes on every transaction. `eventual` is faster and loses the last
    # acknowledged writes if the machine dies; a directory is not the place for that.
    durability: immediate

# The first administrator, created on startup if, and only if, the store is empty.
#
# Remove this section once you have bound as that administrator at least once. Left in
# place it does nothing and says so in the log, but a password on disk that nothing reads
# is a password that goes stale in a drawer.
bootstrap:
  dn: cn=admin,ou=users,dc=example,dc=com
  password_env: RUST_REST_LDAP_ADMIN_PASSWORD

# Passwords. Argon2id by default; `pbkdf2-sha512` for clients whose tooling needs it.
passwords:
  store_scheme: argon2id
  # A hash written by an older server is upgraded on the next successful bind, which is
  # the only moment the password is known. Turn off only if something else writes the hashes.
  upgrade_on_bind: true

# Schema checking. `strict` refuses a write that breaks the definitions, `warn` logs and
# accepts it, `off` skips the check. Strict is the default because a directory that accepts
# anything is a directory whose data nobody can query.
schema:
  mode: strict
  #files:
  #  - /etc/rust-rest-ldap/local.schema
  # Definitions added at run time through `cn=schema,cn=config` are written here by the server,
  # in the same syntax as the files above. There is no need to edit this by hand: the entry is
  # what a client writes, and this is where the result is kept so it survives a restart.
  #definitions:
  #  - >
  #    attributeType ( 1.3.6.1.4.1.99999.1.1 NAME 'favouriteDrink'
  #        EQUALITY caseIgnoreMatch SUBSTR caseIgnoreSubstringsMatch
  #        SYNTAX 1.3.6.1.4.1.1466.115.121.1.15 )

# Uniqueness and referential integrity: one `uid`, one `cn` per unit, and no group listing
# a user that does not exist.
integrity:
  unique: [cn, uid]
  allow_duplicates: false
  referential_integrity: true

# Indexes. Without them a filter scans every entry; with them the server narrows the
# candidates first. `pres` answers (attribute=*), `eq` answers (attribute=value); both are
# supersets, and the filter still runs on every candidate. Per-attribute kinds replace
# `default` for that attribute.
indexes:
  default: [pres]
  attributes:
    objectClass: [eq, pres]
    uid: [eq]
    cn: [eq, pres]
    sn: [eq]
    mail: [eq]
    memberUid: [eq]

# What the server refuses to do, whatever the client asked for.
#
# Every client may ask for everything: `ldapsearch -z 0` is the ordinary spelling of it, and against
# a large directory that is one request that occupies the server and is bounded by nothing an
# operator wrote down. A policy is the limit the operator wrote, and the smaller of the two wins.
#
# `size_limit` bounds what is sent and is applied to the entries that matched - after the filter, so
# a limit of a thousand never refuses a search that would have returned one entry. `time_limit`
# bounds the scan, and it is the only limit that bounds a search returning almost nothing: a broad
# filter with no index costs the scan, not the answer.
#
# Absent or zero means no limit, which is what every deployment had before this existed. That is a
# default, not an oversight: a limit chosen by the software would be one nobody measured, and
# refusing a legitimate bulk export is its own kind of outage.
#limits:
#  size_limit: 5000
#  time_limit: 30

# Access control. Rules are checked in order and the first match decides; without a match
# the request is refused, so the list has to end with an allow for the people who need it.
#
# `subject` is one of `admin`, `users`, `anonymous`, `self`, `dn=<distinguished name>` or
# `group=<group name>`. `attributes` narrows a rule to some attributes; `base` to a subtree.
access:
  - subject: admin
    attributes: ["*"]
    rights: [read, search, compare, write, auth]
  - subject: users
    attributes: ["*"]
    rights: [read, search, compare]
  # A user may change their own password and nothing else.
  - subject: self
    attributes: [userPassword]
    rights: [write]
  # Anonymous readers. `attributes` has to be `*` or absent for this rule to cover the
  # search itself: a subtree search asks about the entry as a whole (no attribute in
  # particular), and a rule that names four attributes does not answer that question, so
  # the search is refused and the client sees "no such object". Passwords are not exposed
  # by `*`: they are marked sensitive and only an administrator is served them.
  - subject: anonymous
    attributes: ["*"]
    rights: [read, search]

# Replication, if this node takes part in one. Left out, it stands alone.
#
# `server_id` is this node's number, written into the third field of every change sequence
# number it issues. It must differ from every peer's: two nodes sharing an id produce changes
# that cannot be told apart, and the order between them cannot be recovered afterwards - so the
# server refuses at startup, and again at the first exchange if a peer disagrees with what is
# written here.
#
# A peer is an ordinary LDAP server, and the exchange is RFC 4533 `refreshAndPersist`: changes
# arrive pushed, deletions included, which a poll cannot express. Give the bind a DN that can
# read the whole naming context - the base being replicated is this node's own.
#
# `journal_keep` bounds how far back this node can answer for, because the journal is the only
# place a deletion is remembered. A peer that falls further behind than this is told to do a
# full refresh instead of being given a gap it would never notice. Omit the key and nothing is
# pruned: correct for a node whose peers may be down for a long time, and a slow leak for one
# nobody reads. Zero is refused.
#
# `conflict_log` records the one outcome an operator has to act on: two nodes disagreeing about
# an entry in a way no timestamp settles, so one version was kept and the other exists only on
# its own node. One JSON object per line - DN, both change numbers, reason - and it survives a
# restart, unlike standard error. `ldap_replication_conflicts_total` counts them for alerting.
#server_id: 1
#replication:
#  journal_keep: 100000
#  # The other bound, and the one a count cannot express: a quiet directory keeps a year of
#  # records under a generous count, a busy one keeps hours. A tombstone say what used to exist,
#  # so it should outlive the slowest peer and no longer. Zero is refused: it would drop the only
#  # record that a deletion ever happened.
#  journal_max_age: 30d
#  conflict_log: /var/lib/rust-rest-ldap/conflicts.jsonl
#peers:
#  - url: ldaps://node2.example.com:636
#    server_id: 2
#    bind_dn: cn=replicator,dc=example,dc=com
#    password: <secret>

# SASL: proving identity by Kerberos ticket instead of by password.
#
# A password bind needs the password on the client machine - in a file, readable by the service
# that runs as that account. A ticket the client already holds replaces it, and this server never
# sees a secret that could be reused elsewhere. `ldapsearch -Y GSSAPI` is the client side.
#
# The keytab is what `kadmin ktadd -k` produced for this service's principal, typically
# `ldap/<hostname>@REALM`. It is read once at startup: reading it per bind would turn a file
# permission mistake into a request-by-request failure. `--check-config` validates the section
# WITHOUT reading the file, since on a hardened host it belongs to root and the service account.
#
# `realms` is not optional when a keytab is set. A ticket from a realm nobody mapped has no
# honest subtree, and guessing one would put a stranger's principal into somebody's directory.
# Every value substituted into `dn` is escaped first, so a principal whose name contains a comma
# cannot address an entry outside the template.
#
# With this section present the server also publishes an Active Directory compatible schema
# (`userPrincipalName`, `sAMAccountName`, `userAccountControl`, `objectGUID`, `servicePrincipalName`
# and the `user`/`group`/`computer` classes): a client that authenticates by ticket is usually from
# that world and asks for those names. `userAccountControl` is honoured on a ticket bind -
# ACCOUNTDISABLE and LOCKOUT are refusals - and an account is looked up by its userPrincipalName
# before the template, refusing an ambiguous one.
#
# A ticket is accepted only over TLS or StartTLS: channel binding is not implemented, so a captured
# ticket could otherwise be replayed. The SASL security layer is not implemented either - the client
# must select "none", because TLS is where the encryption belongs.
#sasl:
#  keytab: /etc/rust-rest-ldap/ldap.keytab
#  service_principal: ldap/host.example.com@EXAMPLE.COM
#  realms:
#    - name: example.com
#      dn: "uid={user},ou=users,{base}"

# Subtrees this server does not hold, and where a client is sent for them. Referrals are how a
# naming context points at a part of the tree somebody else keeps: nothing is copied and nothing
# is cached. A base under no referral and outside this tree is still `noSuchObject`, so a typo in
# a DN stays a typo.
#referrals:
#  - dn: dc=remote,dc=com
#    url: ldaps://ldap.remote.example.com

# Reload: the file backends are re-read on this interval, on SIGUSR1, and on
# `HEAD /callback` with the token below. With the redb backend there is nothing to re-read,
# but the interval still drives the entry cache refresh.
update_interval: 300s

# The callback listener. Its token is a bearer secret; the listener speaks plain HTTP, so
# putting it on anything but a loopback or a service network needs AllowPlainHttpRest.
#http_listen_addr: 127.0.0.1:8080
#callback_auth_token: <long random string>

# The change journal: one JSON line per write with the DN, the actor, the client and the
# result. A deleted entry takes its own modifiersName with it, so "who deleted this" is
# answerable only if it was written down when it happened.
observability:
  journal: /var/lib/rust-rest-ldap/changes.jsonl
  journal_stdout: false

# Operator diagnostics in Russian; the text on the wire stays English.
#locale: ru

# Dangerous settings. Each one is a sentence rather than a boolean, so a configuration
# copied from a hardening guide cannot switch it on by accident. Listed here only so that
# the names are known - none of them is on.
#
#AllowDangerousSettings: "Yes I know this is bad idea"
#bind:
#  AllowUnencryptedBind: "Yes I know this is bad idea"
#AllowPlainHttpRest: "Yes I know this is bad idea"
#passwords:
#  AllowWeakHashes: "Yes I know this is bad idea"
#  AllowedWeakHashes: ssha, crypt-md5
